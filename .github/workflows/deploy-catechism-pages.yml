name: Deploy catechism to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.js
        run: |
          echo "window.GOOGLE_TTS_API_KEY = '${{ secrets.GOOGLE_TTS_API_KEY }}';" > config.js

      - name: Cache busting
        run: |
          HASH=$(git rev-parse --short HEAD)
          find . -maxdepth 1 -name "*.html" -exec sed -i "s/?v=[a-zA-Z0-9_.-]*/?v=$HASH/g" {} \;
          sed -i "s/catechism-shell-v[^']*/catechism-shell-$HASH/" sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
