<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5efe4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="성경 소요리문답" />
    <title>성경 소요리문답</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-shell">
        <div id="detail-toolbar" class="detail-toolbar hidden" aria-label="상세 보기 도구">
          <button id="btn-back" class="nav-btn" aria-label="목록으로 이동">목록</button>
          <div class="font-controls">
            <button id="btn-font-decrease" class="nav-btn font-btn" aria-label="글자 작게">가-</button>
            <span id="font-size-display" class="font-display">100%</span>
            <button id="btn-font-increase" class="nav-btn font-btn" aria-label="글자 크게">가+</button>
          </div>
        </div>
        <p class="site-mark">WESTMINSTER CATECHISM</p>
        <h1>성경 소요리문답</h1>
        <div class="header-rule" aria-hidden="true"></div>
        <p class="subtitle">웨스트민스터 소요리문답 전문 107문 · 개역개정</p>
      </div>
    </header>

    <main>
      <section id="list-view" aria-label="소요리문답 목록">
        <div class="list-toolbar">
          <span class="section-label">문항 선택</span>
          <input
            id="search"
            class="search-input"
            type="search"
            placeholder="문번호 또는 단어 검색"
            aria-label="문항 검색"
          />
        </div>
        <div class="cards-grid" id="cards-container" role="list"></div>
      </section>

      <section id="detail-view" class="hidden" aria-label="문항 상세">
        <nav class="detail-nav" aria-label="문항 이동">
          <button id="btn-prev" class="nav-btn ghost" aria-label="이전 문항">이전</button>
          <span id="nav-counter" class="nav-counter" aria-live="polite"></span>
          <button id="btn-next" class="nav-btn ghost" aria-label="다음 문항">다음</button>
        </nav>

        <div class="detail-header">
          <div id="d-num" class="detail-num" aria-hidden="true"></div>
          <div id="d-question" class="detail-question" role="heading" aria-level="2"></div>
        </div>

        <div class="answer-box" role="region" aria-label="답">
          <div class="answer-label" aria-hidden="true">답</div>
          <p id="d-answer" class="answer-text"></p>
        </div>

        <div class="verses-box" role="region" aria-label="성경 참고 구절">
          <div class="verses-label">성경 참고 구절</div>
          <div id="d-verses"></div>
        </div>

        <div id="d-quiz" class="quiz-box" role="region" aria-label="빈칸 퀴즈"></div>

        <nav class="detail-nav detail-nav-bottom" aria-label="문항 이동">
          <button id="btn-prev-bottom" class="nav-btn ghost" aria-label="이전 문항">이전</button>
          <span id="nav-counter-bottom" class="nav-counter" aria-live="polite"></span>
          <button id="btn-next-bottom" class="nav-btn ghost" aria-label="다음 문항">다음</button>
        </nav>
      </section>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
